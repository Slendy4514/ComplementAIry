name: ci
on: [push, pull_request]
jobs:
  cai:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/complementairy } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - run: node dist/cli.js selftest
  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/vscode-complementairy } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install
      - run: pnpm build
      # Que la extensión arranque (un error al cargar o activar no lo ve el compilador).
      - run: node scripts/humo.cjs
      # Los paneles Tarea y Comprensión contra la CLI real (sin IA): se dibujan y sus botones funcionan.
      - run: pnpm install && pnpm build
        working-directory: packages/complementairy
      - run: node scripts/paneles.cjs
