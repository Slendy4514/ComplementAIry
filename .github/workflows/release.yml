# Al crear un tag vX.Y.Z publica en GitHub Releases el paquete de la CLI (.tgz) y la extensión (.vsix).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: CLI
        working-directory: packages/complementairy
        run: |
          pnpm install && pnpm build && node dist/cli.js selftest
          pnpm pack --pack-destination ../../release
          mv ../../release/complementairy-*.tgz ../../release/complementairy.tgz
      - name: Extensión de VSCode
        working-directory: packages/vscode-complementairy
        run: |
          pnpm install && pnpm build
          npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository -o ../../release/complementairy.vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/complementairy.tgz
            release/complementairy.vsix
