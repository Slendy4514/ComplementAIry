# AICode en CI: repite las verificaciones deterministas y rechaza comentarios de conversación olvidados.
# Requiere que el paquete aicode esté disponible: publicalo (npm) o definí la variable AICODE_PKG
# con la URL de un tarball (`pnpm pack` en packages/aicode).
name: aicode
on: [push, pull_request]
jobs:
  aicode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && pnpm install --frozen-lockfile
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: npm i -g ${{ vars.AICODE_PKG || 'aicode' }}
      - run: aicode guia check
      - run: aicode gate
