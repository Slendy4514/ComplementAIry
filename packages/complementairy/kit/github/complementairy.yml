# ComplementAIry en CI: repite las verificaciones deterministas y rechaza comentarios de conversación olvidados.
# Requiere la variable de repositorio CAI_PKG con la URL del paquete, p. ej.:
#   https://github.com/Slendy4514/ComplementAIry/releases/latest/download/complementairy.tgz
name: cai
on: [push, pull_request]
jobs:
  cai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && pnpm install --frozen-lockfile
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: npm i -g ${{ vars.CAI_PKG }}
      - run: cai guia check
      - run: cai gate
